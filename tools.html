			<section>
				<h2>Litres per 100 km</h2>
				
				<input type="number" id="litres-per-100_litres">
				<label for="litres-per-100_litres">Litres used</label>

				<br>

				<input type="number" id="litres-per-100_kilometers">
				<label for="litres-per-100_kilometers">Kilometers travelled</label>

				<p>
					<math id="litres-per-100_output"></math>
				</p>

				<script>(() => {
					const eLitres = document.getElementById('litres-per-100_litres');
					const eKilometers = document.getElementById('litres-per-100_kilometers');
					const eOutput = document.getElementById('litres-per-100_output');

					function update() {
						const litres = parseFloat(eLitres.value);
						const kilometers = parseFloat(eKilometers.value);

						if (isNaN(litres) || isNaN(kilometers)) {
							eOutput.textContent = '';
							return;
						}

						eOutput.textContent = ((litres / kilometers) * 100.0).toFixed(2) + 'L/100km';
					}

					eLitres.oninput = update;
					eKilometers.oninput = update;

					update();
				})()</script>
			</section>

			<section>
				<h2>Days between dates</h2>

				<input type="date" id="time-between-dates_start">
				<label for="time-between-dates_start">Start date</label>

				<br>

				<input type="date" id="time-between-dates_end">
				<label for="time-between-dates_end">End date</label>

				<p>
					<math id="time-between-dates_output"></math>
				</p>

				<script>(() => {
					// wow, this is near identical to above lol
					const eStart = document.getElementById('time-between-dates_start');
					const eEnd = document.getElementById('time-between-dates_end');
					const eOutput = document.getElementById('time-between-dates_output');

					function update() {
						const startDate = new Date(eStart.value);
						const endDate = new Date(eEnd.value);

						if (isNaN(startDate) || isNaN(endDate)) {
							eOutput.textContent = '';
							return;
						}

						if (startDate > endDate) {
							eOutput.textContent = 'Start date is after the end date!';
							return;
						}

						// Trick from https://flaviocopes.com/how-to-count-days-between-dates-javascript/
						// Why doesn't JS give us this natively??
						let days = 0;

						while (startDate < endDate) {
							startDate.setDate(startDate.getDate() + 1);
							days += 1;
						}

						eOutput.textContent = `${days} day${days > 1 ? 's' : ''}.`;
					}

					eStart.oninput = update;
					eEnd.oninput = update;

					update();
				})()</script>
			</section>
